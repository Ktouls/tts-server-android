pluginManagement {
    includeBuild("build-logic")
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
        
        maven { 
            url 'https://jitpack.io' 
            // 👇 关键修改：带上 GitHub Token 作为通行证
            credentials { username = System.getenv("GITHUB_TOKEN") ?: 'authToken' }
        }
    }

    versionCatalogs {
        libs {
            from(files("./libs.versions.toml"))
        }
    }
}

rootProject.name = "TTS Server"
include ':app'
include ':lib-common'
include ':lib-compose'
include ':lib-database'
include ':lib-tts'
include ':lib-script'
include ':lib-server'
